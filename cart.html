<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fad store - cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #000; color: #fff; margin: 0; padding: 0;">

  <header class="site-header" style="padding: 16px;">
    <a href="index.html" class="gothic-logo" style="font-size:36px;">fad</a>
    <a href="index.html" style="color:#aaa; font-size:12px; text-transform:uppercase;">← Back to Shop</a>
  </header>

  <main class="section" style="max-width: 600px; min-height: 60vh; margin: 0 auto; padding: 20px;">
    <h1 style="font-family: var(--font-display); text-transform: uppercase; margin-bottom: 24px; border-bottom: 1px solid #222; padding-bottom: 12px;">Your Cart</h1>

    <div id="cart-items-container">
      <!-- filled by cart-page.js -->
    </div>

    <div id="discount-section" style="margin: 20px 0;">
      <div style="display:flex; gap:8px;">
        <input type="text" id="discount-input" placeholder="Discount code" style="flex:1; background:transparent; border:1px solid #333; color:#fff; padding:10px 12px; text-transform:uppercase;">
        <button id="apply-discount-btn" type="button" style="background:#111; border:1px solid #333; color:#fff; padding:10px 16px; cursor:pointer;">APPLY</button>
      </div>
      <p id="discount-message" style="font-size:12px; margin-top:8px; min-height:14px;"></p>
    </div>

    <div id="cart-summary" style="border-top: 1px solid #222; padding-top: 16px;">
      <!-- filled by cart-page.js -->
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 fuck a Dress code &nbsp;|&nbsp; <a href="admin.html" style="color:#666;">Admin</a></p>
  </footer>

  <script src="products.js"></script>
  <script src="cart-page.js"></script>
</body>
</html>

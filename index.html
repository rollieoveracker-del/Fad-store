<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fad store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=999999">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body style="background-color: #000; color: #fff; margin: 0; padding: 0;">

  <!-- ANNOUNCEMENT BAR -->
  <div class="announcement">
    SPEND $40 → FREE PATCH &nbsp;|&nbsp; SPEND $75 → FREE SHIPPING + MYSTERY SHIRT
  </div>

  <!-- HEADER BANNER STRIP -->
  <header class="site-header">
    <div class="banner-strip">
      <img src="1789607273385.jpg" class="banner-img-crop" alt="art">
      <img src="banner1.jpg" class="banner-img-crop" alt="art">
      <img src="banner2.png" class="banner-img-crop" alt="art">
      <img src="banner3.jpg" class="banner-img-crop" alt="art">
      <img src="banner4.jpg" class="banner-img-crop" alt="art">
      <img src="banner5.jpg?v=999" class="banner-img-crop" alt="art">
    </div>

    <a href="cart.html" class="cart-icon-btn" title="View Cart">
      <svg viewBox="0 0 24 24" style="width:28px; height:28px; fill:#ff0000; display:block;">
        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
      <span class="cart-count" style="display:none;">0</span>
    </a>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-brand">
      <h1 class="gothic-logo">fad</h1>
      <div class="hero-cross-icon" style="width: 50px; height: 50px;">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
          <rect x="42" y="10" width="16" height="80" fill="#fff"/>
          <rect x="20" y="32" width="60" height="16" fill="#fff"/>
          <circle cx="50" cy="50" r="38" stroke="#ff0000" stroke-width="8" fill="none"/>
          <line x1="22" y1="22" x2="78" y2="78" stroke="#ff0000" stroke-width="8"/>
        </svg>
      </div>
    </div>
  </section>

  <!-- SHOP SECTION -->
  <section class="section shop-section" id="shop">
    <div class="shop-bg"></div>
    <canvas id="shop-static-canvas" class="shop-static-canvas"></canvas>
    <div class="product-grid" id="product-grid"></div>
  </section>

  <!-- ABOUT SECTION -->
  <section class="about-section" id="about">
    <h2>bad clothes for bad people</h2>
  </section>

  <!-- MAILING LIST -->
  <section class="mailing" id="mailing">
    <h2>JOIN THE LIST FOR 15% OFF</h2>
    <p>or don't.... I don't care</p>
    <form class="mailing-form" id="mailing-form">
      <input type="email" id="mailing-email" placeholder="your@email.com" required>
      <button type="submit" id="mailing-submit-btn">JOIN</button>
    </form>
    <p id="mailing-status" style="font-size:12px; margin-top:10px; min-height:16px;"></p>
  </section>

  <footer class="site-footer">
    <p>© 2026 fuck a Dress code &nbsp;|&nbsp; <a href="admin.html" style="color:#666; text-decoration:underline;">Admin Panel</a></p>
  </footer>

  <!-- AUDIO PLAYER -->
  <audio id="bg-audio" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- app.js pulls in products.js itself (ES module import) -->
  <script type="module" src="app.js"></script>
  <script src="static-bg.js"></script>
  <script src="audio-persist.js"></script>

  <script>
    // ---- EmailJS setup ----
    (function () {
      emailjs.init({ publicKey: "8ha80pGskhczzVYSr" });
    })();

    const MAILING_DISCOUNT_CODE = "WELCOME15";

    document.getElementById("mailing-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const emailInput = document.getElementById("mailing-email");
      const status = document.getElementById("mailing-status");
      const btn = document.getElementById("mailing-submit-btn");
      const email = emailInput.value.trim();

      if (!email) return;

      btn.disabled = true;
      btn.textContent = "SENDING...";
      status.textContent = "";

      emailjs.send("service_kslg50b", "template_omzdynm", {
        to_email: email,
        discount_code: MAILING_DISCOUNT_CODE
      }).then(function () {
        status.textContent = "Check your email for your code.";
        status.style.color = "#0f0";
        emailInput.value = "";
      }).catch(function (err) {
        console.error("EmailJS error:", err);
        status.textContent = "Something went wrong — try again.";
        status.style.color = "#ff0000";
      }).finally(function () {
        btn.disabled = false;
        btn.textContent = "JOIN";
      });
    });
  </script>
  <script>
    // Audio start/resume is now handled by audio-persist.js (shared across pages).
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof renderProductGrid === 'function') {
        renderProductGrid("#product-grid");
      }
    });
  </script>
</body>
</html>
